spring:
  application:
    name: invoice-automation-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:h2:mem:invoices;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never

invoice:
  automation:
    overdue-check-cron: "0 0 8 * * *"

app:
  security:
    enabled: true
    api-key: ${API_KEY:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
