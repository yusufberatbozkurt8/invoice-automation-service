spring:
  application:
    name: invoice-automation-service
  datasource:
    url: jdbc:h2:mem:invoices;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8082

invoice:
  automation:
    overdue-check-cron: "0 0 8 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
